<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD49C"/>
      <stop offset="1" stop-color="#11785A"/>
    </linearGradient>
    <radialGradient id="gl" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#gl)"/>
  <g id="art" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <!-- anneau extérieur ~80 % -->
    <circle cx="512" cy="512" r="300" stroke-width="86" stroke-dasharray="1508 1885" transform="rotate(-90 512 512)"/>
    <!-- anneau intérieur ~60 %, plus doux -->
    <circle cx="512" cy="512" r="170" stroke-width="86" stroke-opacity=".55" stroke-dasharray="641 1068" transform="rotate(-90 512 512)"/>
  </g>
</svg>
